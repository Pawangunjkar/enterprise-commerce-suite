server:
  port: 8092
spring:
  application:
    name: kafka-dlq-manager
  datasource:
    url: jdbc:postgresql://localhost:5432/ecs_platform
    username: ecs
    password: ecs_secret
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: kafka-dlq-manager
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/ecs
