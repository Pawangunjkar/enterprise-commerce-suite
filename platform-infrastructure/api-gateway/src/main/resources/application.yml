server:
  port: 8080
spring:
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  application:
    name: api-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8081/realms/ecs}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 40
            redis-rate-limiter.burstCapacity: 80
            key-resolver: "#{@ipKeyResolver}"
      routes:
        - id: payment-ws
          uri: ${ECS_URI_PAY:http://localhost:8305}
          predicates: [Path=/ws/payments/**]
        - id: search
          uri: ${ECS_URI_SEARCH:http://localhost:8090}
          predicates: [Path=/api/v1/search/**]
        - id: pincode
          uri: ${ECS_URI_PINCODE:http://localhost:8091}
          predicates: [Path=/api/v1/pincodes/**]
        - id: cart-abandonment
          uri: ${ECS_URI_CART_ABANDON:http://localhost:8407}
          predicates: [Path=/api/v1/carts/abandonment/**]
        - id: payment-webhooks
          uri: ${ECS_URI_WEBHOOKS:http://localhost:8308}
          predicates: [Path=/api/v1/payments/webhooks/**]
        - id: products
          uri: ${ECS_URI_PRODUCTS:http://localhost:8101}
          predicates: [Path=/api/v1/products/**]
        - id: catalog-variants
          uri: ${ECS_URI_VARIANTS:http://localhost:8102}
          predicates: [Path=/api/v1/catalog/variants/**]
        - id: imei
          uri: ${ECS_URI_IMEI:http://localhost:8103}
          predicates: [Path=/api/v1/imei/**]
        - id: catalog-b2b
          uri: ${ECS_URI_B2B:http://localhost:8104}
          predicates: [Path=/api/v1/catalog/b2b/**]
        - id: catalog-bundles
