# Full microservice stack. Package JARs first: mvn -DskipTests package
# docker compose -f docker-compose.infra.yml -f docker-compose.apps.yml up -d --build

name: ecs

networks:
  ecs:
    name: ecs-net

x-jvm-env: &jvm-env
  SPRING_THREADS_VIRTUAL_ENABLED: "true"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATASOURCE_USERNAME: ecs
  SPRING_DATASOURCE_PASSWORD: ecs_secret
  ECS_SECURITY_ENABLED: "false"
  ECS_SOLR_BASE_URL: http://solr:8983/solr

x-depends: &depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  kafka:
    condition: service_started

services:
  api-gateway:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.jvm
      args:
        JAR_FILE: platform-infrastructure/api-gateway/target/api-gateway-1.0.0-SNAPSHOT.jar
    image: ecs/api-gateway:1.0.0-SNAPSHOT
    ports: ["8080:8080"]
    environment:
      <<: *jvm-env
      SERVER_PORT: "8080"
      ECS_URI_SEARCH: http://search-solr-indexer:8090
      ECS_URI_PINCODE: http://pincode-master-service:8091
      ECS_URI_CART_ABANDON: http://cart-abandonment-service:8407
      ECS_URI_WEBHOOKS: http://webhook-reconciliation-service:8308
      ECS_URI_PRODUCTS: http://product-service:8101
      ECS_URI_VARIANTS: http://variant-matrix-service:8102
      ECS_URI_IMEI: http://serial-imei-tracking-service:8103
      ECS_URI_B2B: http://b2b-tiered-catalog-service:8104
      ECS_URI_BUNDLES: http://component-bundle-service:8105
      ECS_URI_CPQ: http://cpq-rule-engine:8106
      ECS_URI_SCHEMA: http://dynamic-schema-engine:8107
      ECS_URI_OFFERS: http://offer-promotion-service:8108
      ECS_URI_TEMPORAL: http://temporal-activation-service:8109
      ECS_URI_DAM: http://media-dam-service:8110
      ECS_URI_IMPORT: http://bulk-catalog-import-service:8111
      ECS_URI_CART: http://cart-service:8201
      ECS_URI_CHECKOUT: http://checkout-service:8202
      ECS_URI_ORDERS: http://order-orchestrator:8203
      ECS_URI_PRICES: http://dynamic-price-engine:8204
      ECS_URI_ATP: http://atp-inventory-service:8205
      ECS_URI_WMS: http://wms-fulfillment-service:8206
      ECS_URI_ONDC: http://ondc-seller-gateway:8207
      ECS_URI_CARRIER: http://carrier-logistics-service:8208
      ECS_URI_BOPIS: http://bopis-pickup-service:8209
      ECS_URI_NDR: http://ndr-returns-rma-service:8210
      ECS_URI_GST: http://gst-tax-engine:8301
      ECS_URI_TCS: http://tcs-tds-compliance-engine:8302
      ECS_URI_PRICEBOOK: http://price-book-service:8303
      ECS_URI_EMI: http://subscription-emi-service:8304
      ECS_URI_PAY: http://payment-gateway-service:8305
      ECS_URI_COD: http://cod-remittance-reconcile-service:8307
      ECS_URI_INVOICE: http://invoice-service:8309
      ECS_URI_LEDGER: http://general-ledger-service:8310
      ECS_URI_DUNNING: http://dunning-service:8311
      ECS_URI_CUSTOMERS: http://customer-360-service:8401
      ECS_URI_ASSISTED: http://assisted-sales-service:8402
      ECS_URI_ACCOUNTS: http://account-hierarchy-service:8403
      ECS_URI_ADDRESSES: http://contact-address-service:8404
      ECS_URI_TICKETS: http://support-ticket-service:8405
      ECS_URI_LOYALTY: http://loyalty-rewards-service:8406
      ECS_URI_DPDP: http://dpdp-compliance-service:8408
      ECS_URI_DLQ: http://kafka-dlq-manager:8092
      ECS_URI_AUDIT: http://mca-audit-trail-service:8093
      ECS_URI_NOTIFY: http://notification-service:8094
      SPRING_DATA_REDIS_HOST: redis
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/ecs
    depends_on:
      <<: *depends
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [ecs]

