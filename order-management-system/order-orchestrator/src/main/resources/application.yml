server:
  port: 8203
spring:
  application:
    name: order-orchestrator
  datasource:
    url: jdbc:postgresql://localhost:5432/ecs_oms
    username: ecs
    password: ecs_secret
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Kolkata
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-orchestrator
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/ecs
ecs:
  downstream:
    atp-url: ${ECS_ATP_URL:http://localhost:8205}
    payment-url: ${ECS_PAYMENT_URL:http://localhost:8305}
    wms-url: ${ECS_WMS_URL:http://localhost:8206}
    invoice-url: ${ECS_INVOICE_URL:http://localhost:8309}
